[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-email-security-report"
version = "0.0.0"
description = "Scanner source for aggregate Swiss email-security research"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "dnspython==2.8.0",
    "jsonschema==4.23.0",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.setuptools]
packages = ["dmarc_scanner", "release", "figures"]

[tool.setuptools.package-data]
release = ["config/*.json", "schema/*.json", "locales/*.json", "LICENSE-DATA.md", "FIGURE-CONTRACT.md"]
figures = ["charts.json", "fonts/*.ttf", "fonts/*.txt"]
